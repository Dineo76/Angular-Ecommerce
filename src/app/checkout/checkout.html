<div class="checkout-wrapper">

  <div class="checkout-card">

    <div class="checkout-header">
      <h2>☕ Checkout</h2>
      <p>Complete your delivery details to place your order.</p>
    </div>

    <form class="checkout-form" (ngSubmit)="placeOrder()">

      <div class="form-group">
        <label>Full Name</label>

        <input
  type="text"
  [(ngModel)]="customer.name"
  name="name"
  placeholder="Enter your full name">

<p class="error" *ngIf="nameError">
  {{ nameError }}
</p>
      </div>

      <div class="form-group">
        <label>Phone Number</label>

<input
  type="tel"
  [(ngModel)]="customer.phone"
  name="phone"
  placeholder="Example: +27821234567">



<p class="error" *ngIf="phoneError">
  {{ phoneError }}
</p>
      </div>

      <div class="form-group">
        <label>Delivery Address</label>
<textarea
  [(ngModel)]="customer.address"
  name="address"
  rows="4"
  placeholder=" 12 Main Street, Tembisa, Johannesburg">
</textarea>

<p class="error" *ngIf="addressError">
  {{ addressError }}
</p>
      </div>

    </form>

    <div class="summary">

      <h3>🧾 Order Summary</h3>

      <div
        class="summary-item"
        *ngFor="let item of cartItems">

        <span>
          {{ item.product.name }}
          × {{ item.quantity }}
        </span>

        <span>
          R{{ (item.product.price * item.quantity).toFixed(2) }}
        </span>

      </div>

      <hr>

      <div class="summary-total">

        <strong>Total</strong>

        <strong>
          R{{ total.toFixed(2) }}
        </strong>

      </div>

    </div>

    <button
      class="place-order-btn"
      (click)="placeOrder()">

      ☕ Place My Order

    </button>

  </div>

</div>
