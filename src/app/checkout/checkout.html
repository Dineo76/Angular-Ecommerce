<h2>Checkout 🧾</h2>

<div *ngIf="cartItems.length > 0; else empty">
  <div *ngFor="let item of cartItems">
    <p>{{ item.product.name }} - R {{ item.product.price }}</p>
  </div>

  <h3>Total: R {{ total.toFixed(2) }}</h3>

  <button (click)="placeOrder()" class="place-order">
    Place Order ☕
  </button>
</div>

<ng-template #empty>
  <p>Your cart is empty</p>
</ng-template>
