<div class="checkout-container">

  <h2>Checkout 🧾</h2>

  <!-- DELIVERY FORM -->
  <form class="checkout-form" (ngSubmit)="placeOrder()">

    <label>Full Name</label>
    <input type="text" [(ngModel)]="customer.name" name="name" required>

    <label>Phone Number</label>
    <input type="tel" [(ngModel)]="customer.phone" name="phone" required>

    <label>Delivery Address</label>
    <textarea [(ngModel)]="customer.address" name="address" rows="3" required></textarea>

  </form>

  <!-- ORDER SUMMARY -->
  <div *ngIf="cartItems.length > 0; else empty">

    <div *ngFor="let item of cartItems" class="checkout-item">
      <p>{{ item.product.name }} x {{ item.quantity }}</p>
      <p>R {{ item.product.price * item.quantity }}</p>
    </div>

    <hr>

    <h3>Total: R {{ total.toFixed(2) }}</h3>

    <button class="place-order" (click)="placeOrder()">
      Place Order ☕
    </button>

  </div>

  <ng-template #empty>
    <p>Your cart is empty</p>
  </ng-template>

</div>
