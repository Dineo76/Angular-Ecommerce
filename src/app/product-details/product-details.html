<div class="product-page" *ngIf="product">

  <div class="product-image">
    <img [src]="product.image" [alt]="product.name">
  </div>

  <div class="product-info">

    <a routerLink="/menu" class="back-link">
      ← Back to Menu
    </a>

    <h1>{{ product.name }}</h1>

    <p class="description">
      {{ product.description }}
    </p>

    <h2 class="price">
      R {{ product.price }}
    </h2>

    <div class="product-actions">

      <button class="add-btn" (click)="addToCart()">
        Add To Cart
      </button>

      <button class="wishlist-btn" (click)="toggleFavorite()">
        {{ isFavorite() ? '❤️ Remove from Wishlist' : '♡ Add to Wishlist' }}
      </button>

    </div>

    <p class="added-message" *ngIf="addedMessage">
      Added to cart ✓
    </p>

  </div>

</div>
