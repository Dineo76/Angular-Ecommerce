<div class="menu-header">

    <h2>Our Coffee Menu</h2>

    <p>
        Freshly brewed coffee crafted with passion.
        Find your perfect cup.
    </p>

  
</div>

  <!-- filter category-buttons -->
<div class="category-buttons">
 
  <button
    class="category-btn"
    [class.active]="selectedCategory === 'All'"
    (click)="filterCategory('All')">
    All
  </button>

  <button
    class="category-btn"
    [class.active]="selectedCategory === 'Hot Coffee'"
    (click)="filterCategory('Hot Coffee')">
    ☕ Hot Coffee
  </button>

  <button
    class="category-btn"
    [class.active]="selectedCategory === 'Iced Coffee'"
    (click)="filterCategory('Iced Coffee')">
    🧊 Iced Coffee
  </button>

  <button
    class="category-btn"
    [class.active]="selectedCategory === 'Pastries'"
    (click)="filterCategory('Pastries')">
    🥐 Pastries
  </button>

  <button
    class="category-btn"
    [class.active]="selectedCategory === 'Desserts'"
    (click)="filterCategory('Desserts')">
    🍰 Desserts
  </button>

</div>


<!-- the menu listing products -->
<div class="menu-container">

    @for (coffee of productlist; track coffee.id) {

        <div class="coffee">

<div class="wishlist-icon">
  <button
    type="button"
    (click)="favoriteService.toggleFavorite(coffee)"
  >
    {{ favoriteService.isFavorite(coffee.id) ? '❤️' : '♡' }}
  </button>
</div>

            <div
                class="coffee-content"
                [routerLink]="['/product', coffee.id]"
            >

                <img
                  [src]="coffee.image"
                  [alt]="coffee.name"
                  width="310"
                  height="310"
                >

                <h3>{{ coffee.name }}</h3>

                <p>{{ coffee.description }}</p>

                <h4>R{{ coffee.price.toFixed(2) }}</h4>

            </div>

            <div class="button-group">
  <button
    class="cart-btn"
    (click)="addCoffee(coffee)"
  >
    Add To Cart
  </button>

  <button
    class="cart-btn remove"
    (click)="removeCoffee(coffee.id)"
  >
    Remove
  </button>
</div>

        </div>

    }

</div>
